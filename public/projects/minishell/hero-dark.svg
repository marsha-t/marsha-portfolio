<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="800" viewBox="0 0 1648 800" role="img" aria-labelledby="title desc">
  <title id="title">Minishell abstract syntax tree</title>
  <desc id="desc">Logical OR at the root, with a logical AND subtree, a pipeline, and command nodes.</desc>

  <defs>
    <linearGradient id="commandFill" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#161b22"/>
  <stop offset="100%" stop-color="#1d160c"/>
</linearGradient>

<linearGradient id="pipeFill">
  <stop offset="0%" stop-color="#161b22"/>
  <stop offset="100%" stop-color="#111d33"/>
</linearGradient>

<linearGradient id="andFill">
  <stop offset="0%" stop-color="#161b22"/>
  <stop offset="100%" stop-color="#10271a"/>
</linearGradient>

<linearGradient id="orFill">
  <stop offset="0%" stop-color="#161b22"/>
  <stop offset="100%" stop-color="#23173d"/>
</linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow
      dx="0"
      dy="0"
      stdDeviation="6"
      flood-color="#000000"
      flood-opacity="0.45"/>
</filter>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 6 L 0 12 z" fill="#1f2937"/>
    </marker>

    <style>
      .connector {
        fill: none;
        stroke: #c9d1d9;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        marker-end: url(#arrow);
      }
      .node {
        stroke-width: 3;
        rx: 18;
        filter: url(#softGlow);
      }
      .command { fill: url(#commandFill); stroke: #f59e0b; }
      .pipeline { fill: url(#pipeFill); stroke: #3b82f6; }
      .and { fill: url(#andFill); stroke: #22c55e; }
      .or { fill: url(#orFill); stroke: #a855f7; }

      .op-badge {
        stroke-width: 3;
      }
      .or-badge { fill: #eee6ff; stroke: #b39af2; }
      .and-badge { fill: #e4f7ec; stroke: #9edbb9; }
      .pipe-badge { fill: #e8f1ff; stroke: #9fc3ff; }

      .op-text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .or-text { fill: #5b2bc6; font-size: 44px; }
      .and-text { fill: #0b7f45; font-size: 38px; }
      .pipe-text { fill: #1456c0; font-size: 46px; }

      .cmd-main {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 28px;
        font-weight: 700;
        fill: #f0f6fc;
      }
      .prompt {
        fill: #f59e0b;
        font-weight: 800;
      }
      .cmd-sub {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 25px;
        fill: #8b949e;
      }
      .legend-text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 25px;
        fill: #0f172a;
      }
    </style>
  </defs>

  <!-- Connectors behind nodes -->
  <path class="connector" d="M 944 171 V 186 Q 944 203 926 203 H 590 Q 572 203 572 221 V 251"/>
  <path class="connector" d="M 962 171 V 186 Q 962 203 980 203 H 1292 Q 1310 203 1310 221 V 256"/>

  <path class="connector" d="M 558 376 V 391 Q 558 406 542 406 H 364 Q 348 406 348 422 V 451"/>
  <path class="connector" d="M 579 376 V 391 Q 579 406 595 406 H 816 Q 832 406 832 422 V 454"/>

  <path class="connector" d="M 338 571 V 587 Q 338 600 324 600 H 170 Q 156 600 156 615 V 647"/>
  <path class="connector" d="M 358 571 V 587 Q 358 600 372 600 H 527 Q 541 600 541 615 V 647"/>

  <!-- OR node -->
  <rect class="node or" x="774" y="56" width="340" height="116" rx="18"/>
  <circle class="op-badge or-badge" cx="944" cy="114" r="39"/>
  <text class="op-text or-text" x="944" y="114">||</text>

  <!-- AND node -->
  <rect class="node and" x="393" y="260" width="357" height="115" rx="18"/>
  <circle class="op-badge and-badge" cx="571" cy="318" r="39"/>
  <text class="op-text and-text" x="571" y="318">&amp;&amp;</text>

  <!-- Right command -->
  <rect class="node command" x="1120" y="265" width="377" height="115" rx="18"/>
  <text class="cmd-main" x="1157" y="335">
    <tspan class="prompt">$</tspan><tspan dx="18">echo "no errors"</tspan>
  </text>

  <!-- Pipeline node -->
  <rect class="node pipeline" x="193" y="458" width="307" height="114" rx="18"/>
  <circle class="op-badge pipe-badge" cx="347" cy="515" r="38"/>
  <text class="op-text pipe-text" x="347" y="515">|</text>

  <!-- Middle command -->
  <rect class="node command" x="639" y="459" width="381" height="116" rx="18"/>
  <text class="cmd-main" x="670" y="528">
    <tspan class="prompt">$</tspan><tspan dx="18">echo "errors found"</tspan>
  </text>

  <!-- Bottom-left command -->
  <rect class="node command" x="44" y="651" width="256" height="115" rx="18"/>
  <text class="cmd-main" x="75" y="706">
    <tspan class="prompt">$</tspan><tspan dx="18">cat</tspan>
  </text>
  <text class="cmd-sub" x="111" y="742">&lt; input.txt</text>

  <!-- Bottom-right command -->
  <rect class="node command" x="409" y="651" width="270" height="115" rx="18"/>
  <text class="cmd-main" x="440" y="718">
    <tspan class="prompt">$</tspan><tspan dx="18">grep error</tspan>
  </text>
</svg>
