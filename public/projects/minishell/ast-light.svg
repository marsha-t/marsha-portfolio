<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="980" viewBox="0 0 1220 980">
  <defs>
    <style>
      .operator-node { fill: #eef6ff; stroke: #2563eb; stroke-width: 2.5; }
      .command-node { fill: #faf5ff; stroke: #7c3aed; stroke-width: 2.5; }
      .meta-node { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; }
      .pipeline-group { fill: #fffdf5; stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 8 6; }
      .operator-text { fill: #1e3a8a; font: 700 20px Arial, sans-serif; }
      .command-text { fill: #4c1d95; font: 700 17px monospace; }
      .label-text { fill: #475569; font: 600 13px Arial, sans-serif; }
      .meta-text { fill: #334155; font: 14px monospace; }
      .edge { stroke: #64748b; stroke-width: 2.2; fill: none; }
      .pipe-edge { stroke: #d97706; stroke-width: 3; fill: none; }
      .pipe-text { fill: #b45309; font: 700 12px Arial, sans-serif; }
    </style>

    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>

    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d97706"/>
    </marker>
  </defs>


  <!-- Root OR node -->
  <rect class="operator-node" x="540" y="40" width="160" height="60" rx="14"/>
  <text class="operator-text" x="620" y="77" text-anchor="middle">OR (||)</text>

  <!-- AND node -->
  <rect class="operator-node" x="290" y="150" width="170" height="60" rx="14"/>
  <text class="operator-text" x="375" y="187" text-anchor="middle">AND (&amp;&amp;)</text>

  <!-- OR right command -->
  <rect class="command-node" x="860" y="150" width="240" height="72" rx="14"/>
  <text class="command-text" x="980" y="180" text-anchor="middle">CMD("echo")</text>
  <text class="label-text" x="980" y="203" text-anchor="middle">args: "no errors"</text>

  <!-- AND right command -->
  <rect class="command-node" x="530" y="290" width="250" height="72" rx="14"/>
  <text class="command-text" x="655" y="320" text-anchor="middle">CMD("echo")</text>
  <text class="label-text" x="655" y="343" text-anchor="middle">args: "errors found"</text>

  <!-- Pipeline group -->
  <rect class="pipeline-group" x="40" y="260" width="390" height="660" rx="18"/>
  <text x="65" y="290" fill="#b45309" font-family="Arial, sans-serif" font-size="15" font-weight="700">PIPELINE</text>

  <!-- cat -->
  <rect class="command-node" x="170" y="320" width="180" height="70" rx="12"/>
  <text class="command-text" x="260" y="350" text-anchor="middle">CMD("cat")</text>

  <!-- input_list beside cat -->
  <rect class="meta-node" x="45" y="328" width="105" height="54" rx="10"/>
  <text class="label-text" x="97.5" y="349" text-anchor="middle">input_list</text>
  <text class="meta-text" x="97.5" y="369" text-anchor="middle">"input.txt"</text>
  <path class="edge" d="M150 355 L170 355" marker-end="url(#arrow-gray)"/>

  <!-- grep -->
  <rect class="command-node" x="170" y="490" width="180" height="70" rx="12"/>
  <text class="command-text" x="260" y="520" text-anchor="middle">CMD("grep")</text>
  <text class="label-text" x="260" y="542" text-anchor="middle">args: "error"</text>

  <!-- sort -->
  <rect class="command-node" x="170" y="660" width="180" height="70" rx="12"/>
  <text class="command-text" x="260" y="690" text-anchor="middle">CMD("sort")</text>

  <!-- uniq -->
  <rect class="command-node" x="170" y="830" width="180" height="70" rx="12"/>
  <text class="command-text" x="260" y="860" text-anchor="middle">CMD("uniq")</text>
  <text class="label-text" x="260" y="882" text-anchor="middle">args: "-c"</text>

  <!-- Pipe chain -->
  <path class="pipe-edge" d="M260 390 L260 490" marker-end="url(#arrow-orange)"/>
  <text class="pipe-text" x="275" y="445">pipe</text>

  <path class="pipe-edge" d="M260 560 L260 660" marker-end="url(#arrow-orange)"/>
  <text class="pipe-text" x="275" y="615">pipe</text>

  <path class="pipe-edge" d="M260 730 L260 830" marker-end="url(#arrow-orange)"/>
  <text class="pipe-text" x="275" y="785">pipe</text>

  <!-- Logical edges -->
  <path class="edge" d="M570 100 C515 120 420 130 385 150" marker-end="url(#arrow-gray)"/>
  <text class="label-text" x="490" y="125">left</text>

  <path class="edge" d="M670 100 C740 120 930 130 960 150" marker-end="url(#arrow-gray)"/>
  <text class="label-text" x="840" y="125">right</text>

  <path class="edge" d="M330 210 C285 240 260 260 260 320" marker-end="url(#arrow-gray)"/>
  <text class="label-text" x="275" y="245">left</text>

  <path class="edge" d="M420 210 C490 245 585 250 630 290" marker-end="url(#arrow-gray)"/>
  <text class="label-text" x="520" y="245">right</text>

  <!-- Command caption -->
  <text x="610" y="955" text-anchor="middle" fill="#334155" font-family="monospace" font-size="15">
    cat &lt; input.txt | grep error | sort | uniq -c &amp;&amp; echo "errors found" || echo "no errors"
  </text>
</svg>
