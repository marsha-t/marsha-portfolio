<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="980" viewBox="0 0 1220 980">
<defs>
<style>
.background{fill:#0f172a}
.operator-node{fill:#1e293b;stroke:#38bdf8;stroke-width:2.5}
.command-node{fill:#111827;stroke:#a78bfa;stroke-width:2.5}
.meta-node{fill:#1f2937;stroke:#64748b;stroke-width:1.8}
.pipeline-group{fill:#111827;fill-opacity:.25;stroke:#f59e0b;stroke-width:2;stroke-dasharray:8 6}
.operator-text{fill:#e0f2fe;font:700 20px Arial,sans-serif}
.command-text{fill:#ede9fe;font:700 17px monospace}
.label-text{fill:#cbd5e1;font:600 13px Arial,sans-serif}
