.pipe-text{fill:#fbbf24;font:700 12px Arial,sans-serif}
.caption{fill:#cbd5e1;font:15px monospace}
</style>
<marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker>
<marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f59e0b"/></marker>
</defs>
<rect class="operator-node" x="540" y="40" width="160" height="60" rx="14"/><text class="operator-text" x="620" y="77" text-anchor="middle">OR (||)</text>
<rect class="operator-node" x="290" y="150" width="170" height="60" rx="14"/><text class="operator-text" x="375" y="187" text-anchor="middle">AND (&amp;&amp;)</text>
<rect class="command-node" x="860" y="150" width="240" height="72" rx="14"/><text class="command-text" x="980" y="180" text-anchor="middle">CMD("echo")</text><text class="label-text" x="980" y="203" text-anchor="middle">args: "no errors"</text>
<rect class="command-node" x="530" y="290" width="250" height="72" rx="14"/><text class="command-text" x="655" y="320" text-anchor="middle">CMD("echo")</text><text class="label-text" x="655" y="343" text-anchor="middle">args: "errors found"</text>
<rect class="pipeline-group" x="40" y="260" width="390" height="660" rx="18"/>
<text x="65" y="290" fill="#fbbf24" font-family="Arial" font-size="15" font-weight="700">PIPELINE</text>

<rect class="command-node" x="170" y="320" width="180" height="70" rx="12"/><text class="command-text" x="260" y="350" text-anchor="middle">CMD("cat")</text>
<rect class="meta-node" x="45" y="328" width="105" height="54" rx="10"/><text class="label-text" x="97.5" y="349" text-anchor="middle">input_list</text><text class="meta-text" x="97.5" y="369" text-anchor="middle">"input.txt"</text><path class="edge" d="M150 355 L170 355" marker-end="url(#g)"/>

<rect class="command-node" x="170" y="490" width="180" height="70" rx="12"/><text class="command-text" x="260" y="520" text-anchor="middle">CMD("grep")</text><text class="label-text" x="260" y="542" text-anchor="middle">args: "error"</text>
<rect class="command-node" x="170" y="660" width="180" height="70" rx="12"/><text class="command-text" x="260" y="690" text-anchor="middle">CMD("sort")</text>
<rect class="command-node" x="170" y="830" width="180" height="70" rx="12"/><text class="command-text" x="260" y="860" text-anchor="middle">CMD("uniq")</text><text class="label-text" x="260" y="882" text-anchor="middle">args: "-c"</text>

<path class="pipe-edge" d="M260 390 L260 490" marker-end="url(#o)"/><text class="pipe-text" x="275" y="445">pipe</text>
<path class="pipe-edge" d="M260 560 L260 660" marker-end="url(#o)"/><text class="pipe-text" x="275" y="615">pipe</text>
